name: Deploy to dev

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-lambdas:
    name: Deploy SAM stacks (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/sam
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/setup-node@v4
        with:
          node-version: "20"
      - uses: aws-actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Build all SAM stacks
        run: |
          sam build --parallel
      - name: Deploy audit worker
        run: sam deploy --config-env dev --stack-name safedeck-audit-worker-dev
      - name: Deploy dashboard API
        run: sam deploy --config-env dev --stack-name safedeck-dashboard-api-dev
      - name: Deploy upload API
        run: sam deploy --config-env dev --stack-name safedeck-upload-api-dev
      - name: Deploy onboarding API
        run: sam deploy --config-env dev --stack-name safedeck-onboarding-api-dev
      - name: Deploy company resolver
        run: sam deploy --config-env dev --stack-name safedeck-company-resolver-dev
      - name: Deploy email classifier
        run: sam deploy --config-env dev --stack-name safedeck-email-classifier-dev
      - name: Deploy meeting integrations
        run: sam deploy --config-env dev --stack-name safedeck-meeting-integrations-dev
      - name: Deploy IC memo generator
        run: sam deploy --config-env dev --stack-name safedeck-ic-memo-generator-dev

  deploy-web:
    name: Deploy Web (dev)
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish to S3 + invalidate CloudFront
        run: |
          aws s3 sync dist/ s3://safedeck-web-dev-${{ secrets.AWS_ACCOUNT_ID }} --delete
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }} \
            --paths "/*"
        env:
          AWS_REGION: eu-north-1
