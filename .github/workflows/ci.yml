name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-python:
    name: Lint Python (agents)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test-python:
    name: Test Python (agents)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v3
        with:
          working-directory: apps/agents
      - run: uv sync
      - run: uv run pytest --tb=short
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

  lint-web:
    name: Lint Web (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint

  test-web:
    name: Test Web (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false

  validate-sam:
    name: Validate SAM templates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/sam
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/setup-sam@v2
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
      - name: Lint all templates
        run: |
          for f in $(find . -name "template.yaml" -o -name "template.yml"); do
            echo "Validating $f"
            sam validate --template "$f" --lint
          done

  terraform-fmt:
    name: Check shell/Makefile formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Makefile syntax check
        run: make -n help
