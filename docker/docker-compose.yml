# docker-compose.yml — local dev for the frontend.
#
# Builds the web image from docker/Dockerfile.web and runs nginx on port 3000.
# Backend is handled by `sam local start-api` (see scripts/local-dev.sh).
#
# Usage:
#   docker compose -f docker/docker-compose.yml up --build
#   open http://localhost:3000

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    image: safedeck-web:dev
    container_name: safedeck-web
    ports:
      - "3000:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
